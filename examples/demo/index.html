<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DagBee - DAG Pipeline Demo</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: #f0f2f5;
  color: #333;
  min-height: 100vh;
}

.header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  color: white;
  padding: 20px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header h1 { font-size: 24px; font-weight: 600; letter-spacing: 1px; }
.header h1 span { color: #e94560; }
.btn {
  padding: 10px 24px; border: none; border-radius: 8px;
  font-size: 15px; font-weight: 500; cursor: pointer;
  transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary { background: #e94560; color: white; }
.btn-primary:hover { background: #c73a52; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(233,69,96,0.4); }
.btn-primary:disabled { background: #666; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-secondary { background: rgba(255,255,255,0.15); color: white; }
.btn-secondary:hover { background: rgba(255,255,255,0.25); }

.main {
  display: flex; gap: 20px; padding: 24px 32px;
  max-width: 1400px; margin: 0 auto;
  height: calc(100vh - 120px);
}

.canvas-panel {
  flex: 1; background: white; border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  overflow: hidden; display: flex; flex-direction: column; min-width: 0;
}
.canvas-panel h3 {
  padding: 16px 24px; border-bottom: 1px solid #eee;
  font-size: 15px; color: #555; display: flex; align-items: center; gap: 8px;
}
.canvas-container { flex: 1; position: relative; }
svg { width: 100%; height: 100%; }

.log-panel {
  width: 420px; background: #1e1e2e; border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
  display: flex; flex-direction: column; overflow: hidden;
}
.log-panel h3 {
  padding: 16px 24px; color: #cdd6f4; font-size: 15px;
  border-bottom: 1px solid #313244; display: flex; align-items: center; gap: 8px;
}
.log-output {
  flex: 1; overflow-y: auto; padding: 16px 24px;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 13px; line-height: 1.7; color: #cdd6f4;
}
.log-line { white-space: pre-wrap; word-break: break-all; }
.log-line.info { color: #a6e3a1; }
.log-line.warn { color: #f9e2af; }
.log-line.error { color: #f38ba8; }
.log-line.highlight { color: #89b4fa; font-weight: 600; }

.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 500;
}
.status-idle { background: #e2e8f0; color: #64748b; }
.status-running { background: #fef3c7; color: #d97706; animation: pulse 1.5s infinite; }
.status-success { background: #dcfce7; color: #16a34a; }
.status-failed { background: #fee2e2; color: #dc2626; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.node { cursor: pointer; transition: opacity 0.3s; }
.node:hover { opacity: 0.85; }
.node-text { font-size: 12px; font-weight: 500; fill: #333; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.node-sub { font-size: 10px; fill: #888; text-anchor: middle; pointer-events: none; }

.tooltip {
  position: absolute; background: rgba(0,0,0,0.85); color: white;
  padding: 8px 14px; border-radius: 8px; font-size: 12px;
  pointer-events: none; z-index: 100; white-space: nowrap; display: none;
}

.legend {
  display: flex; gap: 16px; padding: 12px 24px;
  border-top: 1px solid #eee; flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }
</style>
</head>
<body>

<div class="header">
  <h1>⚙️ Dag<span>Bee</span> — Data Pipeline Demo</h1>
  <div style="display:flex;gap:12px;align-items:center;">
    <span id="statusBadge" class="status-badge status-idle">⏸ 空闲</span>
    <button id="runBtn" class="btn btn-primary" onclick="runPipeline()">▶ 执行管道</button>
    <button class="btn btn-secondary" onclick="resetView()">🔄 重置</button>
  </div>
</div>

<div class="main">
  <div class="canvas-panel">
    <h3>📊 DAG 拓扑图</h3>
    <div class="canvas-container" id="canvasContainer">
      <svg id="dagSvg"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#e2e8f0;border:2px solid #cbd5e1;"></div> Pending</div>
      <div class="legend-item"><div class="legend-dot" style="background:#fbbf24;"></div> Running</div>
      <div class="legend-item"><div class="legend-dot" style="background:#22c55e;"></div> Success</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ef4444;"></div> Failed</div>
      <div class="legend-item"><div class="legend-dot" style="background:#a78bfa;"></div> Skipped</div>
    </div>
  </div>

  <div class="log-panel">
    <h3>📜 执行日志</h3>
    <div class="log-output" id="logOutput">
      <div class="log-line" style="color:#6c7086;">点击「执行管道」按钮来运行 DAG...</div>
    </div>
  </div>
</div>

<script>
// ============================================================
// State
// ============================================================
let dagData = null;
let nodeStatuses = {};
let isRunning = false;

// ============================================================
// Layout: Compute positions for DAG visualization
// ============================================================
function computeLayout(nodes, edges) {
  const children = {}, parents = {};
  nodes.forEach(n => { children[n.name] = []; parents[n.name] = []; });
  edges.forEach(e => { children[e.from].push(e.to); parents[e.to].push(e.from); });

  const roots = nodes.filter(n => parents[n.name].length === 0);
  const layer = {}; nodes.forEach(n => layer[n.name] = 0);
  const inDegree = {}; nodes.forEach(n => inDegree[n.name] = parents[n.name].length);
  const queue = [...roots];

  while (queue.length > 0) {
    const current = queue.shift();
    children[current.name].forEach(child => {
      layer[child] = Math.max(layer[child], layer[current.name] + 1);
      inDegree[child]--;
      if (inDegree[child] === 0) queue.push(nodes.find(n => n.name === child));
    });
  }

  const maxLayer = Math.max(...Object.values(layer), 0);
  const layers = [];
  for (let i = 0; i <= maxLayer; i++) layers.push(nodes.filter(n => layer[n.name] === i));

  const positions = {};
  const svgW = 800, svgH = 500;
  const marginX = 120, marginY = 80;
  const usableW = svgW - 2 * marginX;
  const usableH = svgH - 2 * marginY;
  const layerH = layers.length > 1 ? usableH / (layers.length - 1) : usableH;

  layers.forEach((layerNodes, li) => {
    const y = marginY + li * layerH;
    layerNodes.forEach((node, ni) => {
      const x = marginX + ((ni + 1) / (layerNodes.length + 1)) * usableW;
      positions[node.name] = { x, y };
    });
  });
  return { positions, layers };
}

// ============================================================
// Render DAG
// ============================================================
function renderDAG() {
  if (!dagData) return;
  const svg = document.getElementById('dagSvg');
  const { nodes, edges } = dagData;
  const { positions } = computeLayout(nodes, edges);

  let html = '<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="26" refY="3.5" orient="auto">'
    + '<polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker></defs>';

  // Draw edges
  edges.forEach(e => {
    const from = positions[e.from], to = positions[e.to];
    if (!from || !to) return;

    const nx = 50, ny = 25;
    const dx = to.x - from.x, dy = to.y - from.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const ux = dx/dist, uy = dy/dist;

    const x1 = from.x + ux*nx, y1 = from.y + uy*ny + ny;
    const x2 = to.x - ux*nx, y2 = to.y - uy*ny - ny;
    const midX = (x1+x2)/2, midY = (y1+y2)/2;

    html += '<path d="M'+x1+','+y1+' Q'+midX+','+y2+' '+x2+','+y2+'" '
      + 'stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.7"/>';
  });

  // Draw nodes
  const nodeR = 28;
  nodes.forEach(n => {
    const pos = positions[n.name];
    if (!pos) return;

    const status = nodeStatuses[n.name] || 'pending';
    let fill = '#e2e8f0', stroke = '#cbd5e1', textColor = '#475569', anim = '';

    switch (status.toLowerCase()) {
      case 'running':
        fill = '#fef3c7'; stroke = '#f59e0b'; textColor = '#92400e';
        anim = '<animate attributeName="opacity" values="1;0.6;1" dur="1s" repeatCount="indefinite"/>';
        break;
      case 'success':
        fill = '#dcfce7'; stroke = '#22c55e'; textColor = '#166534';
        break;
      case 'failed':
        fill = '#fee2e2'; stroke = '#ef4444'; textColor = '#991b1b';
        break;
      case 'skipped':
        fill = '#ede9fe'; stroke = '#a78bfa'; textColor = '#6b21a8';
        break;
      case 'unknown':
        fill = '#f1f5f9'; stroke = '#94a3b8'; textColor = '#64748b';
        break;
    }

    html += '<g class="node" data-node="'+n.name+'" '
      + 'onmouseenter="showTooltip(event,\''+n.name+'\',\''+status+'\',\''+(n.priority||0)+'\')" '
      + 'onmouseleave="hideTooltip()">'
      + '<circle cx="'+pos.x+'" cy="'+pos.y+'" r="'+nodeR+'" '
      + 'fill="'+fill+'" stroke="'+stroke+'" stroke-width="3">'+anim+'</circle>'
      + '<text x="'+pos.x+'" y="'+(pos.y-5)+'" class="node-text" fill="'+textColor+'">'+n.name+'</text>'
      + '<text x="'+pos.x+'" y="'+(pos.y+14)+'" class="node-sub">'+status.toUpperCase()+'</text>'
      + '</g>';
  });

  svg.innerHTML = html;
}

// ============================================================
// Tooltip
// ============================================================
function showTooltip(event, name, status, priority) {
  const tip = document.getElementById('tooltip');
  tip.innerHTML = '<strong>'+name+'</strong><br>Status: '+status+'<br>Priority: '+priority;
  tip.style.display = 'block';
  tip.style.left = (event.offsetX+15)+'px';
  tip.style.top = (event.offsetY-30)+'px';
}
function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

// ============================================================
// Run Pipeline
// ============================================================
async function runPipeline() {
  if (isRunning) return;
  isRunning = true;

  const runBtn = document.getElementById('runBtn');
  const badge = document.getElementById('statusBadge');
  runBtn.disabled = true;
  runBtn.textContent = '⏳ 执行中...';
  badge.className = 'status-badge status-running';
  badge.textContent = '⚡ 运行中';

  if (dagData) {
    dagData.nodes.forEach(n => nodeStatuses[n.name] = 'running');
    renderDAG();
  }

  document.getElementById('logOutput').innerHTML = '';

  try {
    const resp = await fetch('/api/run', { method: 'POST' });
    const result = await resp.json();

    nodeStatuses = result.nodes || {};

    if (result.status === 'Success') {
      badge.className = 'status-badge status-success';
      badge.textContent = '✅ 成功 (' + result.duration + ')';
    } else {
      badge.className = 'status-badge status-failed';
      badge.textContent = '❌ 失败';
    }

    if (result.logs) {
      const logDiv = document.getElementById('logOutput');
      logDiv.innerHTML = result.logs.map(line => {
        let cls = '';
        if (line.includes('完成') || line.includes('通过')) cls = 'info';
        else if (line.includes('错误') || line.includes('失败')) cls = 'error';
        else if (line.includes('===')) cls = 'highlight';
        return '<div class="log-line '+cls+'">'+escapeHtml(line)+'</div>';
      }).join('');
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    renderDAG();
  } catch (err) {
    badge.className = 'status-badge status-failed';
    badge.textContent = '❌ 错误';
    document.getElementById('logOutput').innerHTML = '<div class="log-line error">请求失败: '+escapeHtml(err.message)+'</div>';
  } finally {
    isRunning = false;
    runBtn.disabled = false;
    runBtn.textContent = '▶ 执行管道';
  }
}

function resetView() {
  nodeStatuses = {};
  document.getElementById('statusBadge').className = 'status-badge status-idle';
  document.getElementById('statusBadge').textContent = '⏸ 空闲';
  document.getElementById('logOutput').innerHTML = '<div class="log-line" style="color:#6c7086;">点击「执行管道」按钮来运行 DAG...</div>';
  if (dagData) renderDAG();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// Init
// ============================================================
async function init() {
  try {
    const resp = await fetch('/api/dag');
    dagData = await resp.json();
    dagData.nodes.forEach(n => nodeStatuses[n.name] = 'pending');
    renderDAG();
  } catch (e) {
    console.error('Failed to load DAG info:', e);
    setTimeout(init, 1000);
  }
}
window.addEventListener('resize', () => { if (dagData) renderDAG(); });
init();
</script>
</body>
</html>
